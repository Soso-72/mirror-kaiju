services:
  db:
    image: postgres
    restart: always
    ports:
      - "9696:5432"
    env_file:
      - ./backend/.env
    volumes:
      - db_data:/var/lib/postgresql

  nodeback:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - db
    ports:
      - "3001:3001"
      - "5555:5555"
    env_file:
      - ./backend/.env
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /backend
          ignore:
            - node_modules/
        - action: rebuild
          path: ./backend/package.json

  nodefront:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

volumes:
  db_data: